<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>ZIYO</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      color: white;
      background: #07111f;
    }

    body {
      background:
        linear-gradient(160deg, #07111f 0%, #0b1830 100%);
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      padding: 35px 18px 95px;
    }

    .logo {
      text-align: center;
      font-size: 58px;
      font-weight: 800;
      color: #ffd32a;
      margin-top: 20px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #9ba8bd;
      font-size: 20px;
      margin-top: 4px;
      margin-bottom: 35px;
    }

    .card {
      background: rgba(28, 42, 63, 0.92);
      border: 1px solid #31435f;
      border-radius: 35px;
      padding: 28px;
      margin-bottom: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.2);
    }

    .label {
      color: #aeb9ca;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .balance {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .balance-number {
      font-size: 42px;
      font-weight: 800;
    }

    .coin {
      color: #ffd32a;
      font-size: 26px;
      font-weight: 700;
    }

    .claim {
      width: 100%;
      border: none;
      border-radius: 25px;
      padding: 20px;
      background: #d1ad36;
      color: #07111f;
      font-size: 25px;
      font-weight: 800;
      cursor: pointer;
    }

    .claim:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: #9ba8bd;
      font-size: 18px;
      margin-top: 18px;
      min-height: 24px;
    }

    .error {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: #4a1d28;
      color: #ffb4c0;
      text-align: center;
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .stat {
      background: #18263d;
      border-radius: 30px;
      padding: 25px;
      min-height: 140px;
    }

    .stat-title {
      color: #aeb9ca;
      font-size: 20px;
      margin-bottom: 18px;
    }

    .stat-value {
      font-size: 40px;
      font-weight: 800;
    }

    .progress-title {
      color: #aeb9ca;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .progress-bg {
      height: 16px;
      background: #263854;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #ffd32a;
      border-radius: 20px;
      transition: width .4s;
    }

    .info {
      text-align: center;
      color: #7f8da3;
      font-size: 17px;
      margin-top: 25px;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 88px;
      background: #07101e;
      border-top: 1px solid #1c2a40;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 10;
    }

    .nav {
      text-align: center;
      padding-top: 10px;
      color: #8c98aa;
      font-size: 14px;
    }

    .nav.active {
      color: #ffd32a;
    }

    .nav-icon {
      display: block;
      font-size: 27px;
      margin-bottom: 4px;
    }

    .user {
      text-align: center;
      color: #8e9bb0;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">ZIYO</div>
  <div class="subtitle">Telegram Mini App</div>

  <div class="card">

    <div class="label">Твой баланс</div>

    <div class="balance">
      <div class="balance-number" id="balance">—</div>
      <div class="coin">ZIYO</div>
    </div>

    <button class="claim" id="claimBtn" disabled>
      Загрузка...
    </button>

    <div class="status" id="status">
      Подключение...
    </div>

    <div class="error" id="error"></div>

    <div class="user" id="user"></div>

  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">Уровень</div>
      <div class="stat-value" id="level">1</div>
    </div>

    <div class="stat">
      <div class="stat-title">До следующего</div>
      <div class="stat-value" id="next">1000</div>
    </div>

  </div>

  <div class="card" style="margin-top:18px">

    <div class="progress-title">
      Прогресс уровня
    </div>

    <div class="progress-bg">
      <div class="progress" id="progress"></div>
    </div>

  </div>

  <div class="info">
    Баланс хранится на сервере и привязан к твоему Telegram.
  </div>

</div>

<div class="bottom">

  <div class="nav active">
    <span class="nav-icon">🏠</span>
    Главная
  </div>

  <div class="nav">
    <span class="nav-icon">🎯</span>
    Задания
  </div>

  <div class="nav">
    <span class="nav-icon">👥</span>
    Друзья
  </div>

  <div class="nav">
    <span class="nav-icon">🏆</span>
    Рейтинг
  </div>

  <div class="nav">
    <span class="nav-icon">💰</span>
    Кошелёк
  </div>

</div>

<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  const API =
    "https://ziyo-api.ziedullosaripov8.workers.dev";

  const balanceEl =
    document.getElementById("balance");

  const claimBtn =
    document.getElementById("claimBtn");

  const statusEl =
    document.getElementById("status");

  const errorEl =
    document.getElementById("error");

  const levelEl =
    document.getElementById("level");

  const nextEl =
    document.getElementById("next");

  const progressEl =
    document.getElementById("progress");

  const userEl =
    document.getElementById("user");


  function headers() {

    return {
      "X-Telegram-Init-Data": tg.initData
    };

  }


  function showError(message) {

    errorEl.style.display = "block";
    errorEl.textContent = message;

  }


  function hideError() {

    errorEl.style.display = "none";

  }


  function updateLevel(balance) {

    const level =
      Math.floor(balance / 1000) + 1;

    const current =
      balance % 1000;

    const next =
      1000 - current;

    levelEl.textContent = level;
    nextEl.textContent = next;

    const percent =
      Math.min((current / 1000) * 100, 100);

    progressEl.style.width =
      percent + "%";

  }


  async function loadUser() {

    try {

      hideError();

      if (!tg.initData) {

        throw new Error(
          "Открой ZIYO через Telegram"
        );

      }

      statusEl.textContent =
        "Подключение...";

      const response =
        await fetch(API + "/api/me", {
          method: "GET",
          headers: headers()
        });

      const data =
        await response.json();

      if (!response.ok || !data.ok) {

        throw new Error(
          data.error || "Ошибка сервера"
        );

      }

      balanceEl.textContent =
        Number(data.user.balance).toLocaleString("ru-RU");

      updateLevel(
        Number(data.user.balance)
      );

      if (data.user.first_name) {

        userEl.textContent =
          "👤 " + data.user.first_name;

      }

      claimBtn.disabled = false;
      claimBtn.textContent = "🎁 Получить +50 ZIYO";

      statusEl.textContent =
        "Баланс загружен";

    }

    catch (error) {

      console.error(error);

      balanceEl.textContent = "—";

      claimBtn.disabled = true;
      claimBtn.textContent = "Ошибка подключения";

      statusEl.textContent =
        "Ошибка подключения";

      showError(error.message);

    }

  }


  async function claim() {

    try {

      claimBtn.disabled = true;

      claimBtn.textContent =
        "Получение...";

      hideError();

      const response =
        await fetch(API + "/api/claim", {
          method: "POST",
          headers: {
            ...headers(),
            "Content-Type": "application/json"
          },
          body: JSON.stringify({})
        });

      const data =
        await response.json();

      if (!response.ok || !data.ok) {

        throw new Error(
          data.error || "Не удалось получить награду"
        );

      }

      balanceEl.textContent =
        Number(data.balance).toLocaleString("ru-RU");

      updateLevel(
        Number(data.balance)
      );

      statusEl.textContent =
        "🎉 Получено +" +
        data.reward +
        " ZIYO";

      claimBtn.textContent =
        "Получено +50 ZIYO";

    }

    catch (error) {

      console.error(error);

      statusEl.textContent =
        "Не удалось получить награду";

      showError(error.message);

      claimBtn.disabled = false;

      claimBtn.textContent =
        "🎁 Получить +50 ZIYO";

    }

  }


  claimBtn.addEventListener(
    "click",
    claim
  );


  loadUser();

</script>

</body>
</html>
