<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZIYO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06111f;color:#fff;font-family:Arial,sans-serif}
.app{min-height:100vh;max-width:480px;margin:auto;padding:18px 16px 90px;background:radial-gradient(circle at 50% 25%,#12375d 0,#071525 38%,#04101c 100%)}
header{text-align:center;padding:8px 0 18px}.logo{font-size:32px;font-weight:900;letter-spacing:3px;color:#ffd52b}.sub{font-size:12px;color:#9fb2c8}
.balance{border:1px solid #176da7;border-radius:18px;padding:16px;background:#0b2036;box-shadow:0 0 25px #001b30}
.label{color:#91a8bf;font-size:13px}.amount{font-size:29px;font-weight:800;margin-top:4px}.coin{color:#ffd52b}
.claim{display:block;width:100%;border:0;border-radius:16px;padding:17px;margin-top:16px;background:linear-gradient(90deg,#ffc928,#ffe36b);font-weight:900;font-size:19px;color:#17202b}
.coinbox{text-align:center;padding:28px 0}.coinicon{width:155px;height:155px;border-radius:50%;margin:auto;display:grid;place-items:center;font-size:55px;font-weight:900;color:#fff0a2;border:9px solid #ffc928;box-shadow:0 0 45px #d99e16;background:radial-gradient(circle,#8a6411,#2b2109)}
.card{margin-top:14px;padding:16px;border-radius:16px;background:#0a1c30;border:1px solid #174d78}.row{display:flex;justify-content:space-between;gap:10px}.progress{height:8px;border-radius:10px;background:#172d43;margin-top:10px;overflow:hidden}.bar{height:100%;width:72%;background:linear-gradient(90deg,#7d3cff,#08cfff)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;justify-content:space-around;background:#071524;border-top:1px solid #17415f;padding:10px 5px 12px}nav button{background:none;border:0;color:#8296aa;font-size:11px}nav button.active{color:#ffd52b}nav span{display:block;font-size:20px;margin-bottom:3px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">ZIYO</div><div class="sub">Telegram Mini App</div></header>
<section class="balance"><div class="label">Мой баланс</div><div class="amount"><span id="balance">24,580</span> <span class="coin">ZIYO</span></div></section>
<div class="coinbox"><div class="coinicon">Z</div><button class="claim" onclick="claim()">⚡ CLAIM +50 ZIYO</button></div>
<section class="card"><div class="row"><b>🔥 Ежедневная серия</b><span>7 дней</span></div><div class="progress"><div class="bar"></div></div><p class="sub">Следующая награда через 02:34:18</p></section>
<section class="card"><div class="row"><b>Уровень 12</b><span>72%</span></div><div class="progress"><div class="bar"></div></div></section>
</div>
<nav>
<button class="active"><span>⌂</span>Главная</button><button><span>▣</span>Задания</button><button><span>♧</span>Друзья</button><button><span>♛</span>Рейтинг</button><button><span>◈</span>Кошелёк</button>
</nav>
<script>
function claim(){let el=document.getElementById('balance');let n=parseInt(el.textContent.replace(',',''))+50;el.textContent=n.toLocaleString('en-US');}
</script>
</body></html>
